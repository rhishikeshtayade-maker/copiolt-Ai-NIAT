[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "niat-codepilot"
version = "0.1.0"
description = "Distributed desktop AI coding assistant for NIAT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "PySide6>=6.7.0",
    "mss>=9.0.0",
    "pillow>=10.0.0",
    "httpx>=0.27.0",
    "supabase>=2.4.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]
